[package]
name = "ro-camel-iwf"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimental Rust IMSCAP Diameter Ro to CAMEL interworking"

[workspace]

[dependencies]
anyhow = "1"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
